name = "openmasjid-publisher"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
# Set secrets with: wrangler secret put APP_ORIGIN (and each secret below).
# Non-secret repository values may be placed here or supplied by deployment configuration.
# APP_ORIGIN = "https://example.org"
# GITHUB_OWNER = "owner"
# GITHUB_REPO = "repository"
# GITHUB_BRANCH = "main"
# GITHUB_INSTALLATION_ID = "123456"
# GITHUB_APP_ID = "123456"
# GITHUB_CLIENT_ID = "Iv1..."
