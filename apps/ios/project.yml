name: OpenMasjid
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  OpenMasjidCore:
    path: Core
targets:
  OpenMasjid:
    type: application
    platform: iOS
    sources:
      - path: OpenMasjidApp
    resources:
      - path: OpenMasjidApp/Resources
    dependencies:
      - package: OpenMasjidCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openmasjid.ios
        INFOPLIST_KEY_CFBundleDisplayName: OpenMasjid
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
